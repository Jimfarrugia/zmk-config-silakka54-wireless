# Deep sleep: each half sleeps after 10 minutes without a keypress (600000 ms).
# Press a key to wake it; the first keypress after waking may be lost while it reconnects.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Bluetooth transmit power: +8 dBm (the maximum). 0 dBm gave connection problems at about 2.5 m,
# and +4 dBm still had occasional problems.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# ZMK Studio is OFF on purpose: the keymap is edited in config/lily58.keymap instead.
# With it off, ZMK Studio can't connect to the keyboard. To turn it back on:
#   1. uncomment the two lines below, and
#   2. uncomment the "snippet: studio-rpc-usb-uart" line in build.yaml.
# See "Using ZMK Studio" in README.md.
# CONFIG_ZMK_STUDIO=y
# CONFIG_ZMK_STUDIO_LOCKING=n

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y

# Emable mouse emulation behaviors
CONFIG_ZMK_POINTING=y

# Report both halves' battery levels to the computer (left half collects the right half's level)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
