# keymap-drawer settings, used by .github/workflows/draw-keymaps.yml
# Docs: https://github.com/caksoylar/keymap-drawer/blob/main/CONFIGURATION.md

draw_config:
  # This config builds the lily58 shield, which has 4 key positions the silakka54 doesn't
  # (42, 43: inner bottom row, 53, 54: inner thumbs). Hide them in the drawing.
  svg_extra_style: |
    .keypos-42, .keypos-43, .keypos-53, .keypos-54 { display: none; }

parse_config:
  # Legends for whole bindings
  raw_binding_map:
    "&caps_word": "Caps Word"
    "&type_uname": "Username"
    "&kp LG(MINUS)": "Zoom -"
    "&kp LG(EQUAL)": "Zoom +"
    "&msc SCRL_UP": "Scroll ↑"
    "&msc SCRL_DOWN": "Scroll ↓"
    "&mkp LCLK": "Left click"
    "&mkp RCLK": "Right click"
    "&mkp MCLK": "Mid click"
    "&bt BT_CLR": "BT clear"
    "&bt BT_CLR_ALL": "BT clear all"

  # Legends for keycodes (keymap-drawer's defaults first, then additions for this keymap)
  zmk_keycode_map:
    "EXCLAMATION": "!"
    "EXCL": "!"
    "AT_SIGN": "@"
    "AT": "@"
    "HASH": "#"
    "POUND": "#"
    "DOLLAR": "$"
